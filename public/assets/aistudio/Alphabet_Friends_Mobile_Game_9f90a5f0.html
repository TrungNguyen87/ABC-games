<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alphabet Friends</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka One', cursive;
            touch-action: manipulation; /* Prevents double-tap zoom on mobile */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden; /* Prevent scrolling */
            background-color: #87CEEB; /* Sky blue */
            background-image: radial-gradient(circle, #FFFFFF33 10%, transparent 10%), radial-gradient(circle, #FFFFFF33 10%, transparent 10%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        /* Letter Character Styling */
        .letter-card {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 0 rgba(0,0,0,0.2), 0 15px 20px rgba(0,0,0,0.1);
        }
        
        .letter-card:active {
            transform: translateY(8px) scale(0.95);
            box-shadow: 0 0 0 rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.1);
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop-in {
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px) rotate(-5deg); }
            40%, 80% { transform: translateX(10px) rotate(5deg); }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative">

    <canvas id="confetti-canvas"></canvas>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 z-40 bg-sky-400 flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-5xl text-white mb-8 drop-shadow-lg animate-float" style="text-shadow: 2px 4px 0 #0284c7;">
            Alphabet<br>Friends
        </h1>
        <div class="relative w-40 h-40 bg-red-500 rounded-3xl flex items-center justify-center text-7xl text-white shadow-[0_8px_0_#991b1b] mb-12 animate-pop-in">
            A
            <!-- Cute Eyes -->
            <svg viewBox="0 0 100 50" class="absolute w-2/3 top-1/3 left-1/6 drop-shadow-md">
                <circle cx="25" cy="25" r="18" fill="white"/>
                <circle cx="30" cy="25" r="7" fill="black"/>
                <circle cx="75" cy="25" r="18" fill="white"/>
                <circle cx="70" cy="25" r="7" fill="black"/>
            </svg>
        </div>
        <button id="start-btn" class="px-10 py-5 bg-yellow-400 text-yellow-900 text-4xl rounded-full shadow-[0_8px_0_#ca8a04] active:shadow-[0_0px_0_#ca8a04] active:translate-y-2 transition-all">
            PLAY!
        </button>
        <p class="mt-8 text-white/80 text-sm">Turn up volume for audio</p>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden w-full h-full flex flex-col items-center p-4">
        
        <!-- Header -->
        <div class="w-full flex justify-between items-center mt-4 mb-8 px-4">
            <div id="stars" class="text-4xl text-yellow-300 drop-shadow-md">⭐⭐⭐</div>
            <button id="repeat-btn" class="w-12 h-12 bg-white/30 rounded-full flex items-center justify-center text-2xl active:bg-white/50 transition-colors">
                🔊
            </button>
        </div>

        <!-- Instruction -->
        <h2 id="instruction-text" class="text-4xl text-white drop-shadow-lg text-center mb-8" style="text-shadow: 2px 3px 0 rgba(0,0,0,0.2);">
            Find the letter...
        </h2>

        <!-- Cards Container -->
        <div id="cards-container" class="flex flex-wrap justify-center gap-6 mt-4 w-full max-w-md">
            <!-- Cards will be injected by JS -->
        </div>

        <!-- Feedback Overlay -->
        <div id="feedback" class="absolute pointer-events-none opacity-0 transition-opacity duration-300 inset-0 flex items-center justify-center z-30">
            <h1 id="feedback-text" class="text-6xl text-white font-bold drop-shadow-[0_5px_5px_rgba(0,0,0,0.5)] scale-50 transition-transform duration-300">
                YAY!
            </h1>
        </div>
    </div>

    <script>
        // --- Game Data & Config ---
        const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const COLORS = [
            { bg: 'bg-red-500', shadow: 'shadow-[#991b1b]' },
            { bg: 'bg-orange-400', shadow: 'shadow-[#c2410c]' },
            { bg: 'bg-yellow-400', shadow: 'shadow-[#a16207]' },
            { bg: 'bg-green-500', shadow: 'shadow-[#166534]' },
            { bg: 'bg-blue-500', shadow: 'shadow-[#1e3a8a]' },
            { bg: 'bg-indigo-500', shadow: 'shadow-[#3730a3]' },
            { bg: 'bg-purple-500', shadow: 'shadow-[#581c87]' },
            { bg: 'bg-pink-500', shadow: 'shadow-[#be185d]' },
        ];

        let targetLetter = "";
        let currentOptions = [];
        let score = 0;
        let isInputLocked = false;

        // --- DOM Elements ---
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const startBtn = document.getElementById('start-btn');
        const cardsContainer = document.getElementById('cards-container');
        const instructionText = document.getElementById('instruction-text');
        const repeatBtn = document.getElementById('repeat-btn');
        const feedback = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedback-text');
        const starsDisplay = document.getElementById('stars');

        // --- Speech Synthesis (Text to Speech) ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                // Adjust for toddler-friendly voice (slower, higher pitch if possible)
                utterance.rate = 0.85; 
                utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- Game Logic ---
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startRound() {
            isInputLocked = false;
            cardsContainer.innerHTML = '';
            
            // Pick a target letter
            targetLetter = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
            
            // Pick 2 random wrong letters
            let wrongLetters = ALPHABET.filter(l => l !== targetLetter);
            wrongLetters = shuffle(wrongLetters).slice(0, 2);
            
            currentOptions = shuffle([targetLetter, ...wrongLetters]);

            // Update UI
            instructionText.innerHTML = `Find the letter <span class="text-yellow-300 text-5xl inline-block animate-float">${targetLetter}</span>`;
            
            // Render Cards
            currentOptions.forEach((letter, index) => {
                const colorTheme = COLORS[Math.floor(Math.random() * COLORS.length)];
                
                const card = document.createElement('div');
                card.className = `letter-card relative w-28 h-28 sm:w-36 sm:h-36 ${colorTheme.bg} rounded-3xl flex items-center justify-center text-6xl sm:text-7xl text-white cursor-pointer select-none animate-pop-in`;
                card.style.animationDelay = `${index * 100}ms`;
                
                // The letter text
                card.innerHTML = `
                    <span class="z-10">${letter}</span>
                    <!-- Eyes SVG -->
                    <svg viewBox="0 0 100 50" class="absolute w-3/4 top-[20%] left-[12.5%] drop-shadow-md z-20 pointer-events-none">
                        <circle cx="25" cy="25" r="16" fill="white"/>
                        <!-- Pupils looking forward -->
                        <circle cx="25" cy="25" r="6" fill="black" class="pupil"/>
                        <circle cx="75" cy="25" r="16" fill="white"/>
                        <circle cx="75" cy="25" r="6" fill="black" class="pupil"/>
                    </svg>
                `;

                card.addEventListener('touchstart', (e) => handleTap(e, letter, card), {passive: false});
                card.addEventListener('mousedown', (e) => handleTap(e, letter, card));

                cardsContainer.appendChild(card);
            });

            // Speak instruction
            setTimeout(() => {
                speak(`Can you find the letter ${targetLetter}?`);
            }, 500);
        }

        function handleTap(event, letter, cardElement) {
            event.preventDefault(); // Prevent double tap zoom
            if (isInputLocked) return;

            if (letter === targetLetter) {
                // Correct!
                isInputLocked = true;
                score++;
                updateStars();
                speak(`Yay! That is the letter ${targetLetter}!`);
                
                // Visual feedback
                cardElement.style.transform = 'scale(1.1)';
                cardElement.style.zIndex = '30';
                fireConfetti();
                
                showFeedback("YAY!", "text-yellow-300");

                setTimeout(() => {
                    feedback.classList.remove('opacity-100');
                    feedbackText.classList.remove('scale-100');
                    startRound();
                }, 2500);

            } else {
                // Wrong
                speak(`Oops! That's ${letter}. Look for ${targetLetter}.`);
                
                // Shake animation
                cardElement.classList.remove('animate-shake');
                void cardElement.offsetWidth; // trigger reflow
                cardElement.classList.add('animate-shake');
                
                // Make eyes look confused/sideways temporarily
                const pupils = cardElement.querySelectorAll('.pupil');
                pupils.forEach(p => p.setAttribute('cx', parseFloat(p.getAttribute('cx')) + 4));
                setTimeout(() => {
                    pupils.forEach(p => p.setAttribute('cx', parseFloat(p.getAttribute('cx')) - 4));
                }, 500);
            }
        }

        function updateStars() {
            let stars = "";
            let count = score % 5; // Reset visual stars every 5
            if (count === 0 && score > 0) count = 5;
            if (score === 0) count = 0;
            
            for(let i=0; i<count; i++) stars += "⭐";
            starsDisplay.textContent = stars || "⭐"; // always show at least one blank state or starting state
        }

        function showFeedback(text, colorClass) {
            feedbackText.textContent = text;
            feedbackText.className = `text-6xl font-bold drop-shadow-[0_5px_5px_rgba(0,0,0,0.5)] scale-100 transition-transform duration-300 ${colorClass}`;
            feedback.classList.remove('opacity-0');
            feedback.classList.add('opacity-100');
            
            setTimeout(() => {
                feedback.classList.remove('opacity-100');
                feedback.classList.add('opacity-0');
                feedbackText.classList.remove('scale-100');
                feedbackText.classList.add('scale-50');
            }, 1500);
        }

        // --- Initialization ---
        startBtn.addEventListener('click', () => {
            // Need user interaction to initialize speech synthesis
            speak("Let's play Alphabet Friends!");
            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            setTimeout(startRound, 1000);
        });

        repeatBtn.addEventListener('click', () => {
            if(!isInputLocked) speak(`Find the letter ${targetLetter}`);
        });

        // --- Simple Confetti Particle System ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function fireConfetti() {
            const colors = ['#f87171', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa'];
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 1) * 20 - 5,
                    size: Math.random() * 15 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 10
                });
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.5; // gravity
                p.rot += p.rotSpeed;
                
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctx.restore();

                // Remove off-screen particles
                if (p.y > canvas.height) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animateConfetti);
        }
        animateConfetti();

    </script>
</body>
</html>
